<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept Knowledge Graph (Label+Description Embeddings)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      overflow: hidden;
    }
    #graph-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    svg { display: block; }

    /* Tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(20, 22, 30, 0.95);
      border: 1px solid rgba(100, 120, 255, 0.3);
      border-radius: 10px;
      padding: 14px 18px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    #tooltip .tt-label {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    #tooltip .tt-source {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    #tooltip .tt-cat {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #tooltip .tt-section {
      margin-top: 8px;
    }
    #tooltip .tt-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    #tooltip .tt-edge-info {
      font-size: 12px;
      color: #7eb8ff;
      margin-top: 6px;
    }

    /* Legend */
    #legend {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 50;
    }
    #legend h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    /* Source legend */
    #source-legend {
      position: absolute;
      top: 16px;
      left: 180px;
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 50;
      max-width: 340px;
    }
    #source-legend h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    .source-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .source-ring {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
      margin-top: 1px;
      border: 3px solid;
      background: transparent;
    }
    .source-item span {
      font-size: 11px;
      line-height: 1.4;
    }

    /* Controls */
    #controls {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 50;
      min-width: 220px;
    }
    #controls h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    #controls label {
      display: block;
      margin-bottom: 4px;
      color: #aaa;
    }
    #controls input[type="range"] {
      width: 100%;
      margin-bottom: 10px;
    }
    #threshold-val {
      color: #7eb8ff;
      font-weight: 600;
    }

    /* Title bar */
    #title-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 13px;
      color: #aaa;
      z-index: 50;
      text-align: center;
    }
    #title-bar strong { color: #fff; }
  </style>
</head>
<body>
  <div id="graph-container">
    <svg id="graph-svg"></svg>

    <div id="legend">
      <h3>Categories</h3>
    </div>

    <div id="source-legend">
      <h3>Papers (ring color)</h3>
    </div>

    <div id="controls">
      <h3>Controls</h3>
      <label>Similarity threshold: <span id="threshold-val">0.40</span></label>
      <input type="range" id="threshold-slider" min="0.1" max="0.9" step="0.05" value="0.40" />
      <label style="margin-top: 6px;">
        <input type="checkbox" id="show-labels" checked /> Show labels
      </label>
    </div>

    <div id="title-bar">
      <strong>Concept Knowledge Graph (Label+Description Embeddings)</strong> &mdash; 13 concepts from 2 papers, edges by combined embedding similarity
    </div>

    <div id="tooltip"></div>
  </div>

  <script>
    const CATEGORY_COLORS = {
      technique: "#6C8EFF",
      architecture: "#FF6C8E",
      application: "#6CFF8E",
      dataset: "#FFD56C",
      tool: "#C86CFF",
      benchmark: "#FF8E6C",
      theory: "#6CFFD5",
    };

    const SOURCE_COLORS = {
      "2603.12180.pdf": "#FF9E44",
      "2603.12255.pdf": "#44D4FF",
    };

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph-svg")
      .attr("width", width)
      .attr("height", height);

    // Defs for glow effect
    const defs = svg.append("defs");
    const filter = defs.append("filter").attr("id", "glow");
    filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "coloredBlur");
    const feMerge = filter.append("feMerge");
    feMerge.append("feMergeNode").attr("in", "coloredBlur");
    feMerge.append("feMergeNode").attr("in", "SourceGraphic");

    const container = svg.append("g");

    // Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.2, 5])
      .on("zoom", (event) => container.attr("transform", event.transform));
    svg.call(zoom);

    const tooltip = d3.select("#tooltip");

    let graphData = null;
    let currentThreshold = 0.4;

    const EMBEDDED_DATA = {"directed":false,"multigraph":false,"graph":{},"nodes":[{"id":"2603.12180.pdf::madqa benchmark","label":"madqa benchmark","description":"A large-scale test (2,250 questions over 800 real PDF documents) designed to measure how well AI systems and humans can find and combine information scattered across many complex documents.","why_innovative":"It is the first benchmark that combines fresh, fully human-written questions with visually rich, multi-domain PDFs and requires multi-step reasoning \u2014 closing critical gaps left by all prior document question-answering benchmarks.","impact_on_applications":"This benchmark can drive the development of AI tools that actually work on real office documents \u2014 like automatically answering questions from legal filings, financial reports, or HR manuals \u2014 bringing enterprise document automation much closer to reality.","category":"benchmark","relevance_score":0.98,"source_file":"2603.12180.pdf","source_title":"Strategic Navigation or Stochastic Search? How Agents and Humans Reason Over Document Collections"},{"id":"2603.12180.pdf::accuracy-effort trade-off metric","label":"accuracy-effort trade-off metric","description":"A new way of scoring AI agents that rewards not just getting the right answer, but getting it efficiently \u2014 penalizing systems that burn through many search steps just to stumble upon a correct answer.","why_innovative":"It distinguishes between agents that plan smartly and those that succeed only through brute-force repetition, revealing a hidden inefficiency gap that raw accuracy scores completely miss.","impact_on_applications":"This could push AI assistant tools \u2014 like those used in legal research or financial analysis \u2014 to become dramatically faster and cheaper to run, since they would be optimized to find answers in fewer steps rather than exhaustively searching everything.","category":"technique","relevance_score":0.95,"source_file":"2603.12180.pdf","source_title":"Strategic Navigation or Stochastic Search? How Agents and Humans Reason Over Document Collections"},{"id":"2603.12180.pdf::classical test theory splits","label":"classical test theory splits","description":"A principled method borrowed from educational testing to decide which questions go into the evaluation set \u2014 choosing questions that best separate strong AI systems from weak ones, rather than picking randomly.","why_innovative":"It maximizes the informational value of every question in a benchmark, ensuring the test stays meaningful and challenging even as AI models keep improving over time.","impact_on_applications":"This approach helps AI researchers build more reliable leaderboards and evaluations, so that claims about AI capabilities in real-world document tasks are actually trustworthy \u2014 benefiting anyone who depends on such rankings to choose AI tools.","category":"technique","relevance_score":0.88,"source_file":"2603.12180.pdf","source_title":"Strategic Navigation or Stochastic Search? How Agents and Humans Reason Over Document Collections"},{"id":"2603.12180.pdf::sentinel pool","label":"sentinel pool","description":"A reserved subset of the hardest benchmark questions \u2014 ones no current AI model can solve \u2014 intentionally kept to ensure the benchmark remains challenging and useful far into the future.","why_innovative":"It solves a common problem where AI benchmarks become obsolete quickly once models start scoring near 100%, guaranteeing long-term headroom for measuring genuine progress.","impact_on_applications":"This design ensures that future, more powerful AI systems still have a meaningful bar to clear, helping the research community track real progress in AI document understanding over many years.","category":"technique","relevance_score":0.85,"source_file":"2603.12180.pdf","source_title":"Strategic Navigation or Stochastic Search? How Agents and Humans Reason Over Document Collections"},{"id":"2603.12180.pdf::agentic document collection vqa","label":"agentic document collection vqa","description":"A formal definition of the task where an AI must search through a collection of complex PDF documents, follow visual clues like tables and charts, and combine information from multiple pages or files to answer a question.","why_innovative":"It is the first rigorous formalization of this multi-step, visually grounded, cross-document reasoning task, providing a clear and reproducible framework that the research community lacked.","impact_on_applications":"Formalizing this task accelerates the building of AI systems that can autonomously handle document-heavy workflows \u2014 such as reviewing contracts, auditing financial filings, or researching regulatory documents \u2014 tasks that currently consume enormous human time.","category":"theory","relevance_score":0.92,"source_file":"2603.12180.pdf","source_title":"Strategic Navigation or Stochastic Search? How Agents and Humans Reason Over Document Collections"},{"id":"2603.12180.pdf::human vs. agent competency analysis","label":"human vs. agent competency analysis","description":"A direct side-by-side comparison of how human researchers and AI agents search through document collections, revealing that they succeed on completely different types of questions despite achieving similar overall scores.","why_innovative":"It uncovers that current AI agents rely on brute-force search rather than intelligent planning, identifying a concrete gap in strategic reasoning that simple accuracy numbers hide.","impact_on_applications":"Understanding exactly where AI agents fail compared to humans helps developers build smarter document AI tools that complement human workers rather than just mimicking them poorly \u2014 leading to more effective human-AI collaboration in knowledge-intensive jobs.","category":"application","relevance_score":0.9,"source_file":"2603.12180.pdf","source_title":"Strategic Navigation or Stochastic Search? How Agents and Humans Reason Over Document Collections"},{"id":"2603.12255.pdf::test-time training fast weights","label":"test-time training fast weights","description":"Instead of keeping an AI model's settings frozen after training, this approach lets the model continuously update a small portion of its internal settings (called 'fast weights') while watching a video, so it can actively remember and organize what it sees in real time.","why_innovative":"This lets AI systems process infinitely long video streams without running out of memory, because spatial information is compressed into adaptive weights rather than stored as raw data \u2014 something fixed-parameter models fundamentally cannot do.","impact_on_applications":"This could enable robots and autonomous vehicles to navigate complex, ever-changing environments by continuously building a mental map from live camera feeds. It could also improve AR/VR headsets that need to understand the 3D layout of any room you walk into.","category":"technique","relevance_score":0.98,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"2603.12255.pdf::hybrid ttt architecture","label":"hybrid ttt architecture","description":"A design that mixes two types of processing layers \u2014 standard 'full-attention' layers (which look at everything at once) and 'TTT' layers (which compress and memorize over time) \u2014 in a 1:3 ratio, so the model keeps its original language and vision skills while gaining the ability to handle long video streams.","why_innovative":"This hybrid approach lets developers upgrade existing powerful AI models (like large vision-language models) to handle streaming video without having to retrain them from scratch, preserving years of learned knowledge while adding new streaming capabilities.","impact_on_applications":"This could allow existing AI assistants \u2014 like those used in smart glasses or home robots \u2014 to be upgraded to understand long video sequences without expensive retraining, making spatial AI upgrades faster and cheaper to deploy.","category":"architecture","relevance_score":0.95,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"2603.12255.pdf::spatial-predictive mechanism","label":"spatial-predictive mechanism","description":"A method that uses small 3D 'sliding filters' (borrowed from video processing) on the AI's internal attention signals, so that when the model decides what to remember, it considers neighboring pixels and nearby video frames together rather than each pixel in isolation.","why_innovative":"By baking geometric and temporal neighborhood awareness directly into the memory-update process, the model learns to remember spatially coherent 3D structures rather than disconnected snippets \u2014 a key step toward true scene understanding.","impact_on_applications":"This could dramatically improve how robots understand the physical layout of a room from a moving camera, and could help augmented reality apps more accurately overlay digital objects onto real-world surfaces even as you move around.","category":"technique","relevance_score":0.93,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"2603.12255.pdf::large-chunk ttt update","label":"large-chunk ttt update","description":"Instead of updating the model's memory after every few video frames (which is slow), this approach batches many frames together into large chunks and updates memory all at once in parallel, like processing a paragraph at a time instead of word by word.","why_innovative":"This makes the streaming memory-update process dramatically faster and more practical on real hardware (GPUs), solving a key efficiency bottleneck that previously prevented test-time training from working on long videos.","impact_on_applications":"This efficiency gain means spatial AI could run in real time on devices like self-driving cars or drones, processing continuous video feeds without lag \u2014 something that was previously too slow to be practical.","category":"technique","relevance_score":0.91,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"2603.12255.pdf::parallel sliding-window attention","label":"parallel sliding-window attention","description":"A technique that runs a 'local memory' attention process (only looking at a nearby window of frames) in parallel alongside the main memory-update process, ensuring that details within each video chunk are not lost due to processing boundaries.","why_innovative":"This elegantly solves the problem that large-chunk processing can break the natural continuity within a scene, maintaining fine-grained spatial detail without adding significant computational cost.","impact_on_applications":"For applications like surgical robots or industrial inspection cameras, this means the AI won't miss important spatial details that fall across chunk boundaries, improving reliability in safety-critical settings.","category":"technique","relevance_score":0.88,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"2603.12255.pdf::dense 3d scene description dataset","label":"dense 3d scene description dataset","description":"A specially constructed training dataset where each video scene is paired with rich, comprehensive text descriptions covering object counts, sizes, positions, and spatial relationships \u2014 much more detailed than typical image-caption datasets.","why_innovative":"Existing spatial datasets were too sparse and local to teach a model how to build a complete mental map of a scene; this dense supervision provides the rich 'ground truth' needed to teach the model what spatial information is worth remembering across a long video.","impact_on_applications":"Better training data means AI systems can more accurately answer questions like 'how far is the chair from the door?' or 'how many objects are on the left side?' \u2014 capabilities useful for assistive technologies for the visually impaired or for home automation.","category":"dataset","relevance_score":0.85,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"2603.12255.pdf::muon optimizer for fast weights","label":"muon optimizer for fast weights","description":"A special mathematical update rule used to adjust the model's fast weights during video processing, which keeps the weight updates 'orthogonal' (well-spread and non-redundant) to prevent the memory from becoming unstable or collapsing over long streams.","why_innovative":"Standard gradient updates can cause fast weights to drift or become poorly conditioned over long sequences; this optimizer keeps memory updates stable and well-structured, which is critical for reliable spatial reasoning over hundreds of video frames.","impact_on_applications":"More stable memory updates mean AI systems can reliably track spatial context over very long videos \u2014 for example, remembering where an object was placed 10 minutes ago in a home monitoring or elder-care application.","category":"technique","relevance_score":0.82,"source_file":"2603.12255.pdf","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"}],"links":[{"weight":0.4803,"similarity":0.4803,"source":"2603.12180.pdf::madqa benchmark","target":"2603.12180.pdf::sentinel pool"},{"weight":0.5419,"similarity":0.5419,"source":"2603.12180.pdf::madqa benchmark","target":"2603.12180.pdf::agentic document collection vqa"},{"weight":0.4755,"similarity":0.4755,"source":"2603.12180.pdf::madqa benchmark","target":"2603.12180.pdf::human vs. agent competency analysis"},{"weight":0.4812,"similarity":0.4812,"source":"2603.12180.pdf::accuracy-effort trade-off metric","target":"2603.12180.pdf::human vs. agent competency analysis"},{"weight":0.5539,"similarity":0.5539,"source":"2603.12180.pdf::agentic document collection vqa","target":"2603.12180.pdf::human vs. agent competency analysis"},{"weight":0.4852,"similarity":0.4852,"source":"2603.12255.pdf::test-time training fast weights","target":"2603.12255.pdf::hybrid ttt architecture"},{"weight":0.4955,"similarity":0.4955,"source":"2603.12255.pdf::test-time training fast weights","target":"2603.12255.pdf::spatial-predictive mechanism"},{"weight":0.529,"similarity":0.529,"source":"2603.12255.pdf::test-time training fast weights","target":"2603.12255.pdf::large-chunk ttt update"},{"weight":0.4331,"similarity":0.4331,"source":"2603.12255.pdf::test-time training fast weights","target":"2603.12255.pdf::parallel sliding-window attention"},{"weight":0.5838,"similarity":0.5838,"source":"2603.12255.pdf::test-time training fast weights","target":"2603.12255.pdf::muon optimizer for fast weights"},{"weight":0.4517,"similarity":0.4517,"source":"2603.12255.pdf::hybrid ttt architecture","target":"2603.12255.pdf::spatial-predictive mechanism"},{"weight":0.5623,"similarity":0.5623,"source":"2603.12255.pdf::hybrid ttt architecture","target":"2603.12255.pdf::large-chunk ttt update"},{"weight":0.45,"similarity":0.45,"source":"2603.12255.pdf::hybrid ttt architecture","target":"2603.12255.pdf::parallel sliding-window attention"},{"weight":0.6036,"similarity":0.6036,"source":"2603.12255.pdf::spatial-predictive mechanism","target":"2603.12255.pdf::parallel sliding-window attention"},{"weight":0.5146,"similarity":0.5146,"source":"2603.12255.pdf::large-chunk ttt update","target":"2603.12255.pdf::parallel sliding-window attention"},{"weight":0.4267,"similarity":0.4267,"source":"2603.12255.pdf::large-chunk ttt update","target":"2603.12255.pdf::muon optimizer for fast weights"}]};

    function loadData() {
      if (EMBEDDED_DATA && EMBEDDED_DATA.nodes && EMBEDDED_DATA.nodes.length > 0) {
        graphData = EMBEDDED_DATA;
        buildLegend(graphData.nodes);
        buildSourceLegend(graphData.nodes);
        render(graphData, currentThreshold);
      } else {
        d3.json("output_description/knowledge_graph.json").then(data => {
          graphData = data;
          buildLegend(data.nodes);
          buildSourceLegend(data.nodes);
          render(data, currentThreshold);
        }).catch(err => {
          document.getElementById("title-bar").innerHTML =
            `<strong style="color:#ff6c6c">Error loading knowledge_graph.json</strong> &mdash; run the graph builder first`;
          console.error(err);
        });
      }
    }
    loadData();

    function buildLegend(nodes) {
      const categories = [...new Set(nodes.map(n => n.category))].sort();
      const legend = d3.select("#legend");
      categories.forEach(cat => {
        const item = legend.append("div").attr("class", "legend-item");
        item.append("div")
          .attr("class", "legend-dot")
          .style("background", CATEGORY_COLORS[cat] || "#888");
        item.append("span").text(cat);
      });
    }

    function buildSourceLegend(nodes) {
      const sources = [...new Set(nodes.map(n => n.source_file))];
      const legend = d3.select("#source-legend");
      sources.forEach(src => {
        const title = nodes.find(n => n.source_file === src)?.source_title || src;
        const color = SOURCE_COLORS[src] || "#888";
        const item = legend.append("div").attr("class", "source-item");
        item.append("div")
          .attr("class", "source-ring")
          .style("border-color", color);
        item.append("span").html(`<strong>${src}</strong><br/>${title}`);
      });
    }

    function render(data, threshold) {
      container.selectAll("*").remove();

      const nodes = data.nodes.map(d => ({ ...d }));
      const links = data.links
        .filter(l => l.similarity >= threshold)
        .map(l => ({
          source: l.source,
          target: l.target,
          weight: l.weight,
          similarity: l.similarity,
        }));

      const maxSim = d3.max(links, d => d.similarity) || 1;
      const minSim = d3.min(links, d => d.similarity) || 0;

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(d => 180 - d.similarity * 100))
        .force("charge", d3.forceManyBody().strength(-350))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(45));

      // Draw edges
      const link = container.append("g")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke", d => {
          const t = minSim === maxSim ? 1 : (d.similarity - minSim) / (maxSim - minSim);
          return d3.interpolateRgb("#2a3a5c", "#6C8EFF")(t);
        })
        .attr("stroke-opacity", d => 0.3 + 0.5 * d.similarity)
        .attr("stroke-width", d => 1 + 3 * d.similarity);

      // Draw nodes
      const node = container.append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      // Node circle — fill = category, stroke = source paper
      node.append("circle")
        .attr("r", d => 8 + d.relevance_score * 12)
        .attr("fill", d => CATEGORY_COLORS[d.category] || "#888")
        .attr("stroke", d => SOURCE_COLORS[d.source_file] || "#888")
        .attr("stroke-width", 3)
        .attr("opacity", 0.9)
        .style("filter", "url(#glow)");

      // Node labels
      const labels = node.append("text")
        .text(d => d.label)
        .attr("dx", d => 12 + d.relevance_score * 8)
        .attr("dy", 4)
        .attr("font-size", "11px")
        .attr("fill", "#ccc")
        .attr("font-weight", 500)
        .attr("class", "node-label");

      // Hover interactions
      node.on("mouseover", function(event, d) {
        link.attr("stroke-opacity", l =>
          (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.08
        ).attr("stroke-width", l =>
          (l.source.id === d.id || l.target.id === d.id) ? 3 + 3 * l.similarity : 1
        );

        const connected = new Set();
        connected.add(d.id);
        links.forEach(l => {
          const sid = typeof l.source === "object" ? l.source.id : l.source;
          const tid = typeof l.target === "object" ? l.target.id : l.target;
          if (sid === d.id) connected.add(tid);
          if (tid === d.id) connected.add(sid);
        });
        node.select("circle").attr("opacity", n => connected.has(n.id) ? 1 : 0.15);
        node.select("text").attr("opacity", n => connected.has(n.id) ? 1 : 0.15);

        const connEdges = links.filter(l => {
          const sid = typeof l.source === "object" ? l.source.id : l.source;
          const tid = typeof l.target === "object" ? l.target.id : l.target;
          return sid === d.id || tid === d.id;
        });

        const catColor = CATEGORY_COLORS[d.category] || "#888";
        const srcColor = SOURCE_COLORS[d.source_file] || "#888";
        let html = `
          <div class="tt-label">${d.label}</div>
          <div class="tt-source">${d.source_title}</div>
          <span class="tt-cat" style="background:${catColor}33;color:${catColor}">${d.category}</span>
          <span style="margin-left:6px;font-size:11px;color:#aaa;">relevance: ${d.relevance_score}</span>
          <div class="tt-section">
            <div class="tt-section-title">Description</div>
            ${d.description}
          </div>
          <div class="tt-section">
            <div class="tt-section-title">Why Innovative</div>
            ${d.why_innovative}
          </div>`;
        if (d.impact_on_applications) {
          html += `
          <div class="tt-section">
            <div class="tt-section-title">Impact on Applications</div>
            ${d.impact_on_applications}
          </div>`;
        }
        if (connEdges.length > 0) {
          html += `<div class="tt-edge-info">${connEdges.length} connection(s)</div>`;
        }

        tooltip.html(html).style("display", "block");
        moveTooltip(event);
      })
      .on("mousemove", moveTooltip)
      .on("mouseout", function() {
        link.attr("stroke-opacity", d => 0.3 + 0.5 * d.similarity)
            .attr("stroke-width", d => 1 + 3 * d.similarity);
        node.select("circle").attr("opacity", 0.9);
        node.select("text").attr("opacity", 1);
        tooltip.style("display", "none");
      });

      // Edge hover
      link.on("mouseover", function(event, d) {
        const srcLabel = typeof d.source === "object" ? d.source.label : d.source;
        const tgtLabel = typeof d.target === "object" ? d.target.label : d.target;
        tooltip.html(`
          <div class="tt-label">${srcLabel} &harr; ${tgtLabel}</div>
          <div class="tt-edge-info">Cosine similarity: <strong>${d.similarity.toFixed(4)}</strong></div>
          <div style="font-size:11px;color:#aaa;margin-top:4px;">Based on label+description embedding</div>
        `).style("display", "block");
        moveTooltip(event);
        d3.select(this).attr("stroke", "#fff").attr("stroke-opacity", 1);
      })
      .on("mousemove", moveTooltip)
      .on("mouseout", function(event, d) {
        tooltip.style("display", "none");
        const t = minSim === maxSim ? 1 : (d.similarity - minSim) / (maxSim - minSim);
        d3.select(this)
          .attr("stroke", d3.interpolateRgb("#2a3a5c", "#6C8EFF")(t))
          .attr("stroke-opacity", 0.3 + 0.5 * d.similarity);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      // Toggle labels
      d3.select("#show-labels").on("change", function() {
        labels.style("display", this.checked ? "block" : "none");
      });

      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
    }

    function moveTooltip(event) {
      let x = event.pageX + 15;
      let y = event.pageY + 15;
      const ttNode = tooltip.node();
      const rect = ttNode.getBoundingClientRect();
      if (x + rect.width > width - 10) x = event.pageX - rect.width - 15;
      if (y + rect.height > height - 10) y = event.pageY - rect.height - 15;
      tooltip.style("left", x + "px").style("top", y + "px");
    }

    // Threshold slider
    d3.select("#threshold-slider").on("input", function() {
      currentThreshold = +this.value;
      d3.select("#threshold-val").text(currentThreshold.toFixed(2));
      if (graphData) render(graphData, currentThreshold);
    });

    // Resize
    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      svg.attr("width", w).attr("height", h);
    });
  </script>
</body>
</html>
