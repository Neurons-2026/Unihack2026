<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Concept Knowledge Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      overflow: hidden;
    }
    #graph-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    svg { display: block; }

    /* Tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(20, 22, 30, 0.95);
      border: 1px solid rgba(100, 120, 255, 0.3);
      border-radius: 10px;
      padding: 14px 18px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.5;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    #tooltip .tt-label {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    #tooltip .tt-source {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    #tooltip .tt-cat {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #tooltip .tt-section {
      margin-top: 8px;
    }
    #tooltip .tt-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }
    #tooltip .tt-edge-info {
      font-size: 12px;
      color: #7eb8ff;
      margin-top: 6px;
    }

    /* Legend */
    #legend {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 50;
    }
    #legend h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }

    /* Controls */
    #controls {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      z-index: 50;
      min-width: 220px;
    }
    #controls h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    #controls label {
      display: block;
      margin-bottom: 4px;
      color: #aaa;
    }
    #controls input[type="range"] {
      width: 100%;
      margin-bottom: 10px;
    }
    #threshold-val {
      color: #7eb8ff;
      font-weight: 600;
    }

    /* Title bar */
    #title-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 30, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 13px;
      color: #aaa;
      z-index: 50;
      text-align: center;
    }
    #title-bar strong { color: #fff; }
  </style>
</head>
<body>
  <div id="graph-container">
    <svg id="graph-svg"></svg>

    <div id="legend">
      <h3>Categories</h3>
    </div>

    <div id="controls">
      <h3>Controls</h3>
      <label>Similarity threshold: <span id="threshold-val">0.40</span></label>
      <input type="range" id="threshold-slider" min="0.1" max="0.9" step="0.05" value="0.40" />
      <label style="margin-top: 6px;">
        <input type="checkbox" id="show-labels" checked /> Show labels
      </label>
    </div>

    <div id="title-bar">
      <strong>General AI/ML Concept Knowledge Graph</strong> â€” 35 concepts, edges by embedding similarity (text-embedding-3-large)
    </div>

    <div id="tooltip"></div>
  </div>

  <script>
    const CATEGORY_COLORS = {
      technique: "#6C8EFF",
      architecture: "#FF6C8E",
      application: "#6CFF8E",
      dataset: "#FFD56C",
      tool: "#C86CFF",
      benchmark: "#FF8E6C",
      theory: "#6CFFD5",
    };

    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#graph-svg")
      .attr("width", width)
      .attr("height", height);

    // Defs for glow effect
    const defs = svg.append("defs");
    const filter = defs.append("filter").attr("id", "glow");
    filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "coloredBlur");
    const feMerge = filter.append("feMerge");
    feMerge.append("feMergeNode").attr("in", "coloredBlur");
    feMerge.append("feMergeNode").attr("in", "SourceGraphic");

    const container = svg.append("g");

    // Zoom
    const zoom = d3.zoom()
      .scaleExtent([0.2, 5])
      .on("zoom", (event) => container.attr("transform", event.transform));
    svg.call(zoom);

    const tooltip = d3.select("#tooltip");

    let graphData = null;
    let currentThreshold = 0.4;

    // Embedded graph data (auto-generated by graph builder)
    const EMBEDDED_DATA = {"directed":false,"multigraph":false,"graph":{},"nodes":[{"id":"trendingPaper1.txt::test-time training fast weights","label":"test-time training fast weights","description":"A method where a small portion of an AI model's internal settings (called 'fast weights') are continuously updated while the model is actively processing new video frames, rather than being fixed after training.","why_innovative":"This allows the AI to build up and refine a mental map of a 3D space in real time from an ongoing video stream, something fixed models fundamentally cannot do without re-processing everything from scratch.","impact_on_applications":"This could enable robots and autonomous vehicles to continuously update their understanding of their surroundings as they move, making navigation far more reliable in complex, changing environments. AR/VR headsets could also use this to maintain accurate spatial awareness as users move through a room.","category":"technique","relevance_score":0.98,"source_file":"trendingPaper1.txt","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"trendingPaper1.txt::hybrid ttt architecture","label":"hybrid ttt architecture","description":"A design that mixes two types of AI processing layers \u00e2\u20ac\u201d memory-updating layers (TTT) and traditional full-attention layers \u00e2\u20ac\u201d in a 3-to-1 ratio, so the model can both compress long video history efficiently and still reason with full context when needed.","why_innovative":"It preserves the existing knowledge of a powerful pretrained AI while adding the ability to handle unbounded video streams, avoiding the costly need to retrain the entire model from scratch.","impact_on_applications":"This makes it practical to upgrade existing AI assistants to understand long videos without discarding their existing language and reasoning abilities, which could improve tools like video search, surveillance analysis, or home robot assistants.","category":"architecture","relevance_score":0.95,"source_file":"trendingPaper1.txt","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"trendingPaper1.txt::spatial-predictive mechanism","label":"spatial-predictive mechanism","description":"A lightweight add-on that uses 3D convolutions (a mathematical operation that looks at nearby pixels across space and time simultaneously) to make the AI's memory updates spatially aware, so it understands how objects relate geometrically rather than treating each video token in isolation.","why_innovative":"By giving the memory system a sense of local geometry, the AI learns to compress 3D scene structure more accurately, which directly improves its ability to answer questions like 'how far is the chair from the door?'","impact_on_applications":"This could improve spatial reasoning in applications like assistive devices for the visually impaired that narrate a room's layout, or in warehouse robots that need to track distances between objects as they move.","category":"technique","relevance_score":0.93,"source_file":"trendingPaper1.txt","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"trendingPaper1.txt::large-chunk sliding-window attention","label":"large-chunk sliding-window attention","description":"A strategy that processes many video frames together in large batches (chunks) while using a sliding window (a moving view of nearby frames) to maintain smooth connections between frames, enabling fast parallel computation on GPU hardware.","why_innovative":"Small chunk sizes in prior methods wasted GPU power and broke up the natural spatial structure of video; large chunks with parallel sliding-window attention solve both problems at once, making the approach practical for real-world long videos.","impact_on_applications":"This efficiency gain means spatial AI could run on consumer-grade hardware or in real time on devices like drones, smart cameras, or self-driving cars without requiring massive data centers.","category":"technique","relevance_score":0.9,"source_file":"trendingPaper1.txt","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"trendingPaper1.txt::dense 3d scene description dataset","label":"dense 3d scene description dataset","description":"A specially constructed training dataset where every video scene is annotated with rich, detailed descriptions of 3D spatial relationships \u00e2\u20ac\u201d such as object counts, sizes, directions, and distances \u00e2\u20ac\u201d rather than sparse or partial labels.","why_innovative":"Existing spatial datasets provide only weak, patchy supervision, which gives the AI model very little to learn from; dense scene descriptions provide strong, structured signals that teach the model exactly what spatial information to remember as it watches a video.","impact_on_applications":"Better training data means AI models can answer nuanced spatial questions more accurately, which could improve tools like interior design apps that suggest furniture arrangements or assistive robots that help elderly users navigate their homes.","category":"dataset","relevance_score":0.87,"source_file":"trendingPaper1.txt","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"trendingPaper1.txt::muon optimizer for fast weights","label":"muon optimizer for fast weights","description":"A specialized update rule that adjusts the AI's memory weights using mathematically orthogonalized gradients (directions of improvement that are kept perpendicular to each other), making the learning process more stable and efficient.","why_innovative":"Standard gradient updates can cause the fast weights to drift or become redundant; Muon's orthogonalization ensures each weight update carries unique, non-overlapping information, leading to more stable and expressive spatial memory.","impact_on_applications":"More stable memory updates reduce errors in spatial reasoning over long videos, which matters for safety-critical applications like autonomous driving or surgical robots that must reliably track spatial context over extended periods.","category":"technique","relevance_score":0.85,"source_file":"trendingPaper1.txt","source_title":"Spatial-TTT: Streaming Visual-based Spatial Intelligence with Test-Time Training"},{"id":"trendingPaper2.txt::cross-layer index reuse","label":"cross-layer index reuse","description":"Instead of running a costly 'which tokens matter?' computation at every single layer of an AI model, IndexCache runs it only at a few key layers and shares those results with the surrounding layers.","why_innovative":"It exploits the newly discovered fact that adjacent layers in a transformer almost always pick the same important tokens, turning a redundant O(NL\u00c2\u00b2) computation into a much cheaper one \u00e2\u20ac\u201d without retraining the model.","impact_on_applications":"AI assistants and document summarizers that work with very long texts (like legal documents or entire codebases) could respond significantly faster and at lower cost, making these services more affordable and accessible.","category":"technique","relevance_score":1.0,"source_file":"trendingPaper2.txt","source_title":"IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse"},{"id":"trendingPaper2.txt::greedy layer selection","label":"greedy layer selection","description":"A smart search algorithm that figures out \u00e2\u20ac\u201d without any extra model training \u00e2\u20ac\u201d which layers can safely skip the expensive token-selection step by testing small data samples and keeping only the most necessary computations.","why_innovative":"It allows any existing deployed sparse-attention model to immediately gain speed benefits without retraining, making optimization plug-and-play for production systems.","impact_on_applications":"Companies running large AI models today can apply this method to their existing systems with minimal effort to cut inference costs and response times \u00e2\u20ac\u201d directly lowering the price of AI-powered services like chatbots or search.","category":"technique","relevance_score":0.92,"source_file":"trendingPaper2.txt","source_title":"IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse"},{"id":"trendingPaper2.txt::multi-layer distillation loss","label":"multi-layer distillation loss","description":"A training objective that teaches a single 'which tokens matter?' module to simultaneously serve multiple layers at once, by learning a consensus view of what's important across all those layers.","why_innovative":"It reframes model training so that a shared indexer is explicitly optimized to be useful for a group of layers rather than just one, closing the quality gap that naive index reuse would otherwise introduce.","impact_on_applications":"When building new AI models from scratch with this method, developers get both high accuracy and high speed together \u00e2\u20ac\u201d leading to more capable AI assistants that don't sacrifice quality for efficiency.","category":"technique","relevance_score":0.93,"source_file":"trendingPaper2.txt","source_title":"IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse"},{"id":"trendingPaper2.txt::full-shared layer partitioning","label":"full-shared layer partitioning","description":"A design pattern that divides a model's layers into two types: 'Full' layers that do the full token-selection computation, and 'Shared' layers that simply borrow the result from the nearest Full layer above them.","why_innovative":"It introduces a minimal, hardware-friendly architectural change (just one conditional branch in code) that achieves up to 75% reduction in indexer computations with negligible accuracy loss.","impact_on_applications":"This simple structural change can be dropped into existing AI inference pipelines with very little engineering work, meaning faster and cheaper AI responses in production products almost immediately.","category":"architecture","relevance_score":0.95,"source_file":"trendingPaper2.txt","source_title":"IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse"},{"id":"trendingPaper2.txt::deepseek sparse attention","label":"deepseek sparse attention","description":"A production-ready method where each layer of an AI model uses a lightweight 'scout' module (the lightning indexer) to pre-select the most relevant pieces of text before doing the main, expensive attention computation.","why_innovative":"It reduces the core attention cost from quadratic to near-linear in sequence length while maintaining model quality, making long-context inference practical at scale.","impact_on_applications":"Applications like legal document analysis, long-form code generation, and multi-step AI agents that need to process hundreds of thousands of words become feasible and cost-effective in real products.","category":"architecture","relevance_score":0.85,"source_file":"trendingPaper2.txt","source_title":"IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse"},{"id":"trendingPaper2.txt::cross-layer token selection stability","label":"cross-layer token selection stability","description":"An empirical finding that neighboring layers in a large language model almost always agree on which parts of the input text are most important \u00e2\u20ac\u201d their 'top-k' token selections overlap by 70\u00e2\u20ac\u201c100%.","why_innovative":"Proving this property specifically for sparse-attention indexers (not just full attention) is the key insight that justifies and enables the entire IndexCache approach.","impact_on_applications":"This insight opens a new optimization frontier for any current or future sparse-attention model, potentially leading to a wave of faster, cheaper AI systems across the industry.","category":"theory","relevance_score":0.88,"source_file":"trendingPaper2.txt","source_title":"IndexCache: Accelerating Sparse Attention via Cross-Layer Index Reuse"}],"links":[{"weight":0.5725,"similarity":0.5725,"source":"trendingPaper1.txt::test-time training fast weights","target":"trendingPaper1.txt::muon optimizer for fast weights"},{"weight":0.4008,"similarity":0.4008,"source":"trendingPaper1.txt::spatial-predictive mechanism","target":"trendingPaper2.txt::deepseek sparse attention"},{"weight":0.5208,"similarity":0.5208,"source":"trendingPaper1.txt::large-chunk sliding-window attention","target":"trendingPaper2.txt::deepseek sparse attention"},{"weight":0.4325,"similarity":0.4325,"source":"trendingPaper1.txt::dense 3d scene description dataset","target":"trendingPaper2.txt::deepseek sparse attention"},{"weight":0.4598,"similarity":0.4598,"source":"trendingPaper2.txt::cross-layer index reuse","target":"trendingPaper2.txt::greedy layer selection"},{"weight":0.5033,"similarity":0.5033,"source":"trendingPaper2.txt::cross-layer index reuse","target":"trendingPaper2.txt::full-shared layer partitioning"},{"weight":0.5605,"similarity":0.5605,"source":"trendingPaper2.txt::cross-layer index reuse","target":"trendingPaper2.txt::cross-layer token selection stability"},{"weight":0.4273,"similarity":0.4273,"source":"trendingPaper2.txt::greedy layer selection","target":"trendingPaper2.txt::multi-layer distillation loss"},{"weight":0.5023,"similarity":0.5023,"source":"trendingPaper2.txt::greedy layer selection","target":"trendingPaper2.txt::full-shared layer partitioning"},{"weight":0.4446,"similarity":0.4446,"source":"trendingPaper2.txt::greedy layer selection","target":"trendingPaper2.txt::deepseek sparse attention"},{"weight":0.4578,"similarity":0.4578,"source":"trendingPaper2.txt::greedy layer selection","target":"trendingPaper2.txt::cross-layer token selection stability"}]};

    // Load data: use embedded data, fallback to fetching JSON file
    function loadData() {
      if (EMBEDDED_DATA && EMBEDDED_DATA.nodes && EMBEDDED_DATA.nodes.length > 0) {
        graphData = EMBEDDED_DATA;
        buildLegend(graphData.nodes);
        render(graphData, currentThreshold);
      } else {
        d3.json("output/knowledge_graph.json").then(data => {
          graphData = data;
          buildLegend(data.nodes);
          render(data, currentThreshold);
        }).catch(err => {
          document.getElementById("title-bar").innerHTML =
            `<strong style="color:#ff6c6c">Error loading knowledge_graph.json</strong> â€” run the graph builder first`;
          console.error(err);
        });
      }
    }
    loadData();

    function buildLegend(nodes) {
      const categories = [...new Set(nodes.map(n => n.category))].sort();
      const legend = d3.select("#legend");
      categories.forEach(cat => {
        const item = legend.append("div").attr("class", "legend-item");
        item.append("div")
          .attr("class", "legend-dot")
          .style("background", CATEGORY_COLORS[cat] || "#888");
        item.append("span").text(cat);
      });
    }

    function render(data, threshold) {
      container.selectAll("*").remove();

      const nodes = data.nodes.map(d => ({ ...d }));
      const links = data.links
        .filter(l => l.similarity >= threshold)
        .map(l => ({
          source: l.source,
          target: l.target,
          weight: l.weight,
          similarity: l.similarity,
        }));

      // Edge weight scale
      const maxSim = d3.max(links, d => d.similarity) || 1;
      const minSim = d3.min(links, d => d.similarity) || 0;

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(d => 180 - d.similarity * 100))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(40));

      // Draw edges
      const link = container.append("g")
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke", d => {
          const t = minSim === maxSim ? 1 : (d.similarity - minSim) / (maxSim - minSim);
          return d3.interpolateRgb("#2a3a5c", "#6C8EFF")(t);
        })
        .attr("stroke-opacity", d => 0.3 + 0.5 * d.similarity)
        .attr("stroke-width", d => 1 + 3 * d.similarity);

      // Draw nodes
      const node = container.append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended));

      // Node circle
      node.append("circle")
        .attr("r", d => 8 + d.relevance_score * 12)
        .attr("fill", d => CATEGORY_COLORS[d.category] || "#888")
        .attr("stroke", d => d3.color(CATEGORY_COLORS[d.category] || "#888").brighter(1))
        .attr("stroke-width", 2)
        .attr("opacity", 0.9)
        .style("filter", "url(#glow)");

      // Node labels
      const labels = node.append("text")
        .text(d => d.label)
        .attr("dx", d => 12 + d.relevance_score * 8)
        .attr("dy", 4)
        .attr("font-size", "11px")
        .attr("fill", "#ccc")
        .attr("font-weight", 500)
        .attr("class", "node-label");

      // Hover interactions
      node.on("mouseover", function(event, d) {
        // Highlight connected edges
        link.attr("stroke-opacity", l =>
          (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.08
        ).attr("stroke-width", l =>
          (l.source.id === d.id || l.target.id === d.id) ? 3 + 3 * l.similarity : 1
        );

        // Dim unconnected nodes
        const connected = new Set();
        connected.add(d.id);
        links.forEach(l => {
          const sid = typeof l.source === "object" ? l.source.id : l.source;
          const tid = typeof l.target === "object" ? l.target.id : l.target;
          if (sid === d.id) connected.add(tid);
          if (tid === d.id) connected.add(sid);
        });
        node.select("circle").attr("opacity", n => connected.has(n.id) ? 1 : 0.15);
        node.select("text").attr("opacity", n => connected.has(n.id) ? 1 : 0.15);

        // Tooltip
        const connEdges = links.filter(l => {
          const sid = typeof l.source === "object" ? l.source.id : l.source;
          const tid = typeof l.target === "object" ? l.target.id : l.target;
          return sid === d.id || tid === d.id;
        });

        const catColor = CATEGORY_COLORS[d.category] || "#888";
        let html = `
          <div class="tt-label">${d.label}</div>
          <div class="tt-source">${d.source_title}</div>
          <span class="tt-cat" style="background:${catColor}33;color:${catColor}">${d.category}</span>
          <span style="margin-left:6px;font-size:11px;color:#aaa;">relevance: ${d.relevance_score}</span>
          <div class="tt-section">
            <div class="tt-section-title">Description</div>
            ${d.description}
          </div>
          <div class="tt-section">
            <div class="tt-section-title">Why Innovative</div>
            ${d.why_innovative}
          </div>`;
        if (d.impact_on_applications) {
          html += `
          <div class="tt-section">
            <div class="tt-section-title">Impact on Applications</div>
            ${d.impact_on_applications}
          </div>`;
        }
        if (connEdges.length > 0) {
          html += `<div class="tt-edge-info">${connEdges.length} connection(s)</div>`;
        }

        tooltip.html(html).style("display", "block");
        moveTooltip(event);
      })
      .on("mousemove", moveTooltip)
      .on("mouseout", function() {
        link.attr("stroke-opacity", d => 0.3 + 0.5 * d.similarity)
            .attr("stroke-width", d => 1 + 3 * d.similarity);
        node.select("circle").attr("opacity", 0.9);
        node.select("text").attr("opacity", 1);
        tooltip.style("display", "none");
      });

      // Edge hover
      link.on("mouseover", function(event, d) {
        const srcLabel = typeof d.source === "object" ? d.source.label : d.source;
        const tgtLabel = typeof d.target === "object" ? d.target.label : d.target;
        tooltip.html(`
          <div class="tt-label">${srcLabel} &harr; ${tgtLabel}</div>
          <div class="tt-edge-info">Cosine similarity: <strong>${d.similarity.toFixed(4)}</strong></div>
        `).style("display", "block");
        moveTooltip(event);
        d3.select(this).attr("stroke", "#fff").attr("stroke-opacity", 1);
      })
      .on("mousemove", moveTooltip)
      .on("mouseout", function(event, d) {
        tooltip.style("display", "none");
        const t = minSim === maxSim ? 1 : (d.similarity - minSim) / (maxSim - minSim);
        d3.select(this)
          .attr("stroke", d3.interpolateRgb("#2a3a5c", "#6C8EFF")(t))
          .attr("stroke-opacity", 0.3 + 0.5 * d.similarity);
      });

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);
        node.attr("transform", d => `translate(${d.x},${d.y})`);
      });

      // Toggle labels
      d3.select("#show-labels").on("change", function() {
        labels.style("display", this.checked ? "block" : "none");
      });

      function dragstarted(event) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        event.subject.fx = event.subject.x;
        event.subject.fy = event.subject.y;
      }
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      function dragended(event) {
        if (!event.active) simulation.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
    }

    function moveTooltip(event) {
      let x = event.pageX + 15;
      let y = event.pageY + 15;
      const ttNode = tooltip.node();
      const rect = ttNode.getBoundingClientRect();
      if (x + rect.width > width - 10) x = event.pageX - rect.width - 15;
      if (y + rect.height > height - 10) y = event.pageY - rect.height - 15;
      tooltip.style("left", x + "px").style("top", y + "px");
    }

    // Threshold slider
    d3.select("#threshold-slider").on("input", function() {
      currentThreshold = +this.value;
      d3.select("#threshold-val").text(currentThreshold.toFixed(2));
      if (graphData) render(graphData, currentThreshold);
    });

    // Resize
    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      svg.attr("width", w).attr("height", h);
    });
  </script>
</body>
</html>
